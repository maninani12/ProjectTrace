server {
    listen 8080;
    server_name _;
    # Directory redirects must retain the browser's public origin/port.
    absolute_redirect off;
    root /usr/share/nginx/html;
    # Match the API's default archive byte quota; the API still enforces any
    # lower configured tenant intake limit and archive validation.
    client_max_body_size 512000000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    location /api/ { proxy_pass http://api:8011; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { try_files $uri $uri/ /index.html; }
}
