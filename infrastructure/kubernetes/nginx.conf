server {
    listen 8080;
    server_name _;
    # The ingress owns the public origin, scheme and port.
    absolute_redirect off;
    root /usr/share/nginx/html;
    client_max_body_size 512m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_pass http://projecttrace-api:8011;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { try_files $uri $uri/ /index.html; }
}
