name: ProjectTrace validation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: projecttrace_test
          POSTGRES_USER: projecttrace_test
          POSTGRES_PASSWORD: disposable-ci-fixture-only
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U projecttrace_test -d projecttrace_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PROJECTTRACE_TEST_POSTGRES_URL: postgresql+psycopg://projecttrace_test:disposable-ci-fixture-only@127.0.0.1:15432/projecttrace_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r requirements.lock
      - run: python -m compileall -q backend analyzers integrations workers scripts tests
      - run: ruff check backend analyzers integrations workers tests scripts
      - run: pytest -q
      - run: python -m scripts.benchmark_analyzers --samples 12 --output /tmp/native-benchmarks.json
      - run: mkdir -p data && alembic upgrade head && alembic downgrade base && alembic upgrade head && python -m backend.seed
      - run: pip-audit -r requirements.lock
      - run: npm ci && npm run build && npm test && npm audit
        working-directory: frontend
      - run: docker build -f infrastructure/Dockerfile . && docker build -f infrastructure/frontend.Dockerfile .
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: mkdir -p data && alembic upgrade head && python -m backend.seed
      - name: Run browser acceptance with owned local services
        run: |
          JOB_MODE=local python -m uvicorn backend.main:app --host 127.0.0.1 --port 8011 > /tmp/projecttrace-api.log 2>&1 &
          API_PID=$!
          (cd frontend && npm run dev) > /tmp/projecttrace-ui.log 2>&1 &
          UI_PID=$!
          trap 'kill "$API_PID" "$UI_PID" 2>/dev/null || true' EXIT
          python - <<'PYTHON'
          import time, urllib.request
          for url in ('http://127.0.0.1:8011/ready', 'http://127.0.0.1:5181'):
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=1).close()
                      break
                  except OSError:
                      time.sleep(0.5)
              else:
                  raise RuntimeError('Owned acceptance service did not become ready')
          PYTHON
          cd frontend
          npx playwright test
      - name: Retain browser diagnostics
        if: always()
        run: |
          mkdir -p frontend/test-results/service-logs
          cp /tmp/projecttrace-api.log /tmp/projecttrace-ui.log frontend/test-results/service-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence-${{ github.run_id }}
          path: frontend/test-results
          retention-days: 7
